name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example: v0.8.0) "
        required: true
        default: "v0.8.3"
        type: string
      title:
        description: "Release title"
        required: true
        default: "V8 — Stable PDF Viewer"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version"
            echo "Expected format: vMAJOR.MINOR.PATCH (for example: v0.8.0)"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          gh release create "$VERSION"             --repo "${{ github.repository }}"             --target main             --title "$TITLE"             --generate-notes
